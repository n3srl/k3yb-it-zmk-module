description: |
  Auto-repeats the wrapped behavior while the key is held (initial
  delay, then repeat rate), like OS key repeat but firmware side.
  Needed for macro-based keys (e.g. accent macros) that the host
  cannot auto-repeat.

compatible: "k3yb,behavior-repeat"

include: zero_param.yaml

properties:
  bindings:
    type: phandles
    required: true
  delay-ms:
    type: int
    default: 400
  rate-ms:
    type: int
    default: 250
    description: |
      Repeat period.  Must exceed the wrapped macro's run time (the accent
      macros take ~210 ms with ZMK's default wait/tap times): the wrapped
      binding is released only after the macro finishes, and a fire that
      overlaps the previous one is skipped.
