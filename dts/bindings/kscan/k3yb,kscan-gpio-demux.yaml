description: |
  GPIO keyboard demux controller with active input discharge and
  configurable settle time (fork of zmk,kscan-gpio-demux).

compatible: "k3yb,kscan-gpio-demux"

include: kscan.yaml

properties:
  input-gpios:
    type: phandle-array
    required: true
  output-gpios:
    type: phandle-array
    required: true
  direct-gpios:
    type: phandle-array
    required: true
    description: Directly driven column GPIOs, scanned sequentially after the demux columns
  debounce-period:
    type: int
    default: 5
    description: Stable milliseconds required for both press and release; zero disables debounce
  settle-time-us:
    type: int
    default: 10
    description: Microseconds to wait before each of two row samples after an address change
  active-discharge:
    type: boolean
    description: |
      Actively drive rows low after each column change. Kills residual-charge
      ghosting, but while a key is held it briefly shorts the driven-high
      column into the driven-low row pin, stressing both beyond nRF specs.
      Leave off unless ghosting is proven on healthy hardware.
  polling-interval-msec:
    type: int
    default: 25
